<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA LEVEL ∞</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at center,#182848,#000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:move 5s linear infinite;
}

@keyframes move{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}


/* aura */
.aura{
    position:absolute;
    width:350px;
    height:500px;
    border-radius:50%;
    background:
    radial-gradient(
    circle,
    rgba(255,255,255,.9),
    rgba(120,220,255,.6),
    rgba(0,100,255,.2),
    transparent 70%);
    
    filter:blur(20px);
    animation:auraPulse 1s infinite alternate;
}


.aura2{
    position:absolute;
    width:430px;
    height:600px;
    border-radius:50%;
    border:5px solid rgba(150,230,255,.5);
    filter:blur(10px);
    animation:ring 2s infinite;
}


@keyframes auraPulse{

from{
transform:scale(.9);
}

to{
transform:scale(1.1);
}

}


@keyframes ring{

from{
transform:scale(.8);
opacity:1;
}

to{
transform:scale(1.3);
opacity:0;
}

}



/* character */
.character{

position:absolute;
width:100px;
height:230px;
background:linear-gradient(#aaa,#222);
border-radius:50px 50px 20px 20px;
box-shadow:
0 0 30px white,
0 0 80px cyan;

}


/* UI */

.container{

position:relative;
z-index:5;
text-align:center;

}


h1{

font-size:60px;
letter-spacing:8px;

color:white;

text-shadow:
0 0 10px cyan,
0 0 30px cyan,
0 0 60px blue;

animation:title 1s infinite alternate;

}


@keyframes title{

from{
filter:brightness(1);
}

to{
filter:brightness(2);
}

}



.subtitle{

margin-top:20px;
color:#aaa;
letter-spacing:5px;

}



.boxes{

display:flex;
gap:20px;
justify-content:center;
margin-top:40px;
flex-wrap:wrap;

}


.box{

background:rgba(255,255,255,.1);
border:1px solid cyan;
padding:25px;
border-radius:20px;

width:180px;

box-shadow:
0 0 20px cyan;

backdrop-filter:blur(10px);

}



.number{

font-size:30px;
font-weight:bold;
color:#00ffff;

}



button{

margin-top:40px;

padding:15px 50px;

border:none;
border-radius:50px;

font-size:20px;
font-weight:bold;

color:white;

background:
linear-gradient(90deg,#00ffff,#8b00ff,#ff00aa);

cursor:pointer;

box-shadow:
0 0 30px cyan;

}


button:hover{

transform:scale(1.1);

}



.power{

animation:shake .2s;

}


@keyframes shake{

0%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
100%{transform:translateX(0);}

}



/* energy particles */

.energy{

position:absolute;

width:5px;
height:5px;

background:white;

border-radius:50%;

box-shadow:
0 0 10px cyan;

animation:rise 3s linear infinite;

}


@keyframes rise{

from{

transform:translateY(300px);
opacity:1;

}

to{

transform:translateY(-400px);
opacity:0;

}

}


</style>

</head>


<body>


<div class="aura"></div>
<div class="aura2"></div>

<div class="character"></div>


<div class="container">

<h1>
AURA ∞
</h1>

<div class="subtitle">
MASTERED INSTINCT • GOD MODE • MAX POWER
</div>


<div class="boxes">

<div class="box">

<h3>
POWER LEVEL
</h3>

<div class="number" id="power">
9000
</div>

</div>


<div class="box">

<h3>
AURA STATUS
</h3>

<div class="number">
MAX
</div>

</div>


<div class="box">

<h3>
RANK
</h3>

<div class="number">
GOD
</div>

</div>


</div>


<button onclick="ascend()">
⚡ ASCEND ⚡
</button>


</div>



<script>


let power=9000;


function ascend(){

power += Math.floor(Math.random()*9999)+1000;

document.getElementById("power").innerHTML=
power.toLocaleString();


document.body.classList.add("power");


setTimeout(()=>{

document.body.classList.remove("power");

},200);


}


/* stars */

for(let i=0;i<80;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(star);

}


/* aura energy */

for(let i=0;i<60;i++){

let e=document.createElement("div");

e.className="energy";

e.style.left=
(50+Math.random()*20-10)+"%";

e.style.top="60%";

e.style.animationDelay=
Math.random()*3+"s";

e.style.animationDuration=
(2+Math.random()*3)+"s";


document.body.appendChild(e);

}


setInterval(ascend,4000);


</script>


</body>
</html>
