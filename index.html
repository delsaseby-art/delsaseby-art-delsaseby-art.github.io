<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THUNDER GOD MODE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle,#1c2d55,#000);

color:white;

display:flex;
justify-content:center;
align-items:center;

}



/* lightning background */

.lightning{

position:absolute;

width:100%;
height:100%;

background:
linear-gradient(
120deg,
transparent,
rgba(0,200,255,.4),
transparent
);

animation:storm 2s infinite;

opacity:.4;

}


@keyframes storm{

0%{
transform:translateX(-100%);
}

100%{
transform:translateX(100%);
}

}




/* Odin golden aura */

.odin{

position:absolute;

width:450px;
height:450px;

border-radius:50%;


background:

radial-gradient(
circle,
gold,
orange,
transparent 70%
);


filter:blur(40px);


animation:aura 2s infinite alternate;


}


@keyframes aura{


from{

transform:scale(.8);

opacity:.7;

}

to{

transform:scale(1.2);

opacity:1;

}

}





/* Thor body */

.hero{

position:absolute;

width:140px;
height:260px;

background:
linear-gradient(
silver,
#333
);


border-radius:

70px 70px 30px 30px;


box-shadow:

0 0 40px cyan;


}





.container{

position:relative;
z-index:5;

text-align:center;

}



h1{


font-size:60px;

color:white;


text-shadow:

0 0 10px cyan,
0 0 40px blue,
0 0 80px white;


}


.subtitle{

margin-top:20px;

letter-spacing:5px;

color:#ddd;

}




.stats{

display:flex;

gap:20px;

justify-content:center;

margin-top:40px;

flex-wrap:wrap;

}



.card{

background:

rgba(255,255,255,.1);


border:

2px solid cyan;


padding:25px;

border-radius:20px;


width:180px;


box-shadow:

0 0 25px cyan;


backdrop-filter:blur(10px);


}



.card span{

display:block;

margin-top:10px;

font-size:30px;

color:#00ffff;

font-weight:bold;

}




button{


margin-top:40px;

padding:20px 50px;


border:none;

border-radius:50px;


font-size:22px;

font-weight:bold;


background:

linear-gradient(
90deg,
cyan,
blue,
gold
);


color:white;


cursor:pointer;


box-shadow:

0 0 30px cyan;


}




button:hover{

transform:scale(1.1);

}




/* thunder flash */

.flash{

animation:

flash .2s;

}



@keyframes flash{


0%{

filter:brightness(1);

}


50%{

filter:brightness(5);

}


100%{

filter:brightness(1);

}


}




.particle{

position:absolute;

width:5px;
height:5px;

background:white;

border-radius:50%;


box-shadow:

0 0 15px cyan;


animation:fall 3s linear infinite;

}



@keyframes fall{


from{

transform:translateY(-50px);

}


to{

transform:translateY(100vh);

}


}



</style>


</head>


<body>



<div class="lightning"></div>

<div class="odin"></div>

<div class="hero"></div>



<div class="container">


<h1>
⚡ THUNDER GOD ⚡
</h1>


<div class="subtitle">

ODIN FORCE • STORM BREAKER • ALL FATHER POWER

</div>



<div class="stats">


<div class="card">

POWER

<span id="power">

10000

</span>

</div>



<div class="card">

TITLE

<span>

GOD

</span>

</div>



<div class="card">

ENERGY

<span>

ODIN

</span>

</div>



</div>




<button onclick="awaken()">

🔨 AWAKEN THUNDER

</button>



</div>





<script>


let power=10000;



function awaken(){


power+=Math.floor(Math.random()*10000);


document.getElementById("power").innerHTML=
power.toLocaleString();



document.body.classList.add("flash");



setTimeout(()=>{

document.body.classList.remove("flash");

},200);



thunder();


}




function thunder(){


let sound=new Audio();


// optional: add your own thunder sound file here

// sound.src="thunder.mp3";
// sound.play();



}





// particles

for(let i=0;i<100;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"%";

p.style.animationDelay=
Math.random()*3+"s";


document.body.appendChild(p);



}



setInterval(()=>{

power+=500;

document.getElementById("power").innerHTML=
power.toLocaleString();


},2000);



</script>


</body>

</html>
